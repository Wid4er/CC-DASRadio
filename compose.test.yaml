services:
  radio-tests:
    build:
      context: ./radio-service
      target: test
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-dasradio}
      POSTGRES_USER: ${POSTGRES_USER:-dasradio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      SERVICE_TOKEN: test-only-token
      RUN_DB_TESTS: "1"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

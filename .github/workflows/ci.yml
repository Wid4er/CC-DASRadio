name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, docs/hito-2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: dasradio
      POSTGRES_USER: dasradio
      POSTGRES_PASSWORD: ci-only-password
      SERVICE_TOKEN: ci-only-token
      COMPOSE_PROFILES: ""
      SEED_DEMO: "true"
      HADOLINT_IMAGE: hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Compose
        run: docker compose -f compose.yaml -f compose.test.yaml config --quiet
      - name: Validate credential-free evaluation launcher
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Lint Dockerfiles
        run: |
          docker run --rm -i "$HADOLINT_IMAGE" hadolint - < radio-service/Dockerfile
          docker run --rm -i "$HADOLINT_IMAGE" hadolint - < discord-service/Dockerfile
          docker run --rm -i "$HADOLINT_IMAGE" hadolint - < web-service/Dockerfile
      - name: Build production images and check TypeScript
        run: docker compose build radio-service discord-service web-service
      - name: Lint Python and run unit and PostgreSQL integration tests
        run: docker compose -f compose.yaml -f compose.test.yaml run --build --rm radio-tests
      - name: Start API and check readiness
        run: docker compose up -d --wait web-service
      - name: Check Discord service to API communication without a Discord token
        run: docker compose run --rm --no-deps discord-service node dist/check-api.js
      - name: Check provider audio to Opus without connecting to Discord
        run: docker compose run --rm --no-deps discord-service node dist/check-voice.js
      - name: Check shared web listening and audio with real API and PostgreSQL
        run: |
          docker compose run --rm --no-deps -v "$PWD/web-service/test:/checks:ro" web-service node /checks/check-live.mjs
      - name: Stop test environment
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml down --remove-orphans

  publish:
    name: Publish ${{ matrix.service }}
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [radio-service, discord-service, web-service]
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the commit image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}:sha-${GITHUB_SHA}"
          docker build --target runtime \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image" "./${SERVICE}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish and record the image digest
        run: |
          docker push "$IMAGE"
          digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          printf '### %s\n\nCommit: `%s`\n\nImage: `%s`\n\nDigest: `%s`\n' \
            "$SERVICE" "$GITHUB_SHA" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: End registry session
        if: always()
        run: docker logout ghcr.io

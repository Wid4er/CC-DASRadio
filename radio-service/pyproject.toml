[project]
name = "cc-dasradio-radio-service"
version = "0.1.0"
description = "API interna de catálogo y reproducción de CC-DASRadio"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.153.0",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requiere PostgreSQL real y RUN_DB_TESTS=1"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

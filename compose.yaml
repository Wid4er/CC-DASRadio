name: cc-dasradio

x-radio-environment: &radio-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-dasradio}
  POSTGRES_USER: ${POSTGRES_USER:-dasradio}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
  SERVICE_TOKEN: ${SERVICE_TOKEN:?Configura SERVICE_TOKEN en .env}

services:
  postgres:
    image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dasradio}
      POSTGRES_USER: ${POSTGRES_USER:-dasradio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  radio-service:
    image: cc-dasradio/radio-service:local
    build:
      context: ./radio-service
      target: runtime
    environment:
      <<: *radio-environment
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RADIO_PORT:-8000}:8000"
    networks:
      - backend
      - control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  discord-service:
    profiles: ["discord"]
    image: cc-dasradio/discord-service:local
    build:
      context: ./discord-service
      target: runtime
    environment:
      RADIO_SERVICE_URL: http://radio-service:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Configura SERVICE_TOKEN en .env}
      STATION_ID: ${STATION_ID:-1}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
    depends_on:
      radio-service:
        condition: service_healthy
    networks:
      - control

networks:
  backend:
    internal: true
  control:

volumes:
  postgres-data:
